<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Auto Scroller</h1>

    <div class="button-row">
      <button id="start">Start</button>
      <button id="stop">Stop</button>
    </div>

    <div class="speed-row">
      <span id="speed-min">0.5</span>
      <input
        id="speed-input"
        type="range"
        min="0.5"
        max="20"
        step="0.5"
        value="1.0"
      />
      <span id="speed-max">20</span>
    </div>

    <div class="speed-row2">
      <button id="minus">-</button>
      <span id="speed-label">Speed: <span id="speed-value">1.0</span></span>
      <button id="plus">+</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
